name: Deploy SWE Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-swe-docs-production
  cancel-in-progress: true

env:
  APP_PATH: /opt/apps/swe-docs

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Show deploy key fingerprint
        run: ssh-keygen -lf ~/.ssh/deploy_key

      - name: Sync project to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          deploy_user="${VPS_USER:-deploy}"
          ssh_target="${deploy_user}@${VPS_HOST}"
          ssh_cmd="ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"

          ssh -i ~/.ssh/deploy_key \
            -p "${VPS_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$ssh_target" \
            "mkdir -p '${APP_PATH}' && test -w '${APP_PATH}'"

          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'infra/ansible/inventory.ini' \
            --exclude 'infra/ansible/vars.yml' \
            --exclude 'site/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            -e "$ssh_cmd" \
            ./ "$ssh_target:${APP_PATH}/"

      - name: Rebuild and restart container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          deploy_user="${VPS_USER:-deploy}"
          ssh -i ~/.ssh/deploy_key \
            -p "${VPS_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${deploy_user}@${VPS_HOST}" \
            "if [ ! -f '${APP_PATH}/.env' ]; then echo 'Missing ${APP_PATH}/.env. Run the vps-setup Ansible playbook before deploying.'; exit 1; fi; cd '${APP_PATH}' && docker compose up -d --build --remove-orphans && docker compose ps"
