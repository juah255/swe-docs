          - SQL: backend/dbms/sql.md
          - Transaction: backend/dbms/transaction.md
          - Normalization: backend/dbms/normalization.md
          - Indexing: backend/dbms/indexing.md
          - Questions: backend/dbms/questions.md
      - OOP:
          - Overview: backend/oop/overview.md
          - SOLID: backend/oop/solid.md
          - Design Patterns: backend/oop/design-patterns.md
          - Relationship: backend/oop/relationship.md
