site_name: SWE Docs
site_description: Internal software engineering documentation
site_url: https://example.com

docs_dir: src

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Backend:
      - Overview: backend/index.md
      - APIs and Communication: backend/apis-and-communication.md
      - DBMS:
          - Overview: backend/dbms/overview.md
          - SQL: backend/dbms/sql.md
          - Transaction: backend/dbms/transaction.md
          - Normalization: backend/dbms/normalization.md
          - Indexing: backend/dbms/indexing.md
      - System Design: backend/system-design.md
      - DevOps and Infrastructure: backend/devops-and-infrastructure.md
      - Design Patterns: backend/design-patterns.md
      - Tab 24: backend/tab-24.md
      - Basic: backend/basic/index.md
      - Languages:
          - Go: backend/languages/go.md
          - JavaScript: backend/languages/javascript.md
          - Type Script: backend/languages/type-script.md
          - PHP: backend/languages/php.md
      - Libraries & Frameworks:
          - NestJS: backend/libraries-frameworks/nestjs.md
          - Fast Api: backend/libraries-frameworks/fast-api.md
          - Spring boot: backend/libraries-frameworks/spring-boot.md
          - React: backend/libraries-frameworks/react.md
          - NextJS: backend/libraries-frameworks/nextjs.md
      - OS: backend/os/index.md
  - DevOps: devops/index.md
  - AI Engineering: ai-engineering/index.md
  - Frontend: frontend/index.md
  - Projects:
      - Overview: projects/index.md
      - DoNow: projects/donow.md
      - CourseHub: projects/coursehub.md
  - Resources: resources/index.md
